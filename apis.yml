description: Edra is an AI automation platform that analyzes an organization's existing
  business data - tickets, logs, messages, and system records - to automatically discover
  and document how operational processes actually run, then turns that knowledge into
  workflows that AI agents can execute reliably. The company targets knowledge-intensive
  functions such as IT service management and technical support, and integrates with
  common enterprise systems including ServiceNow, JIRA, Zendesk, Salesforce, and Outlook.
  Edra was surfaced as a portfolio company of 8vc and added to the API Evangelist network.
  As of this enrichment pass Edra publishes a corporate marketing site but no public
  developer API, documentation, SDKs, or developer portal.
